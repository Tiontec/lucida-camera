name: 澄影重构版 iOS 自动打包

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub 运行器（11.1.2 起不再需要 iOS 26 SDK，默认用更稳定常见的 macos-15 就行）'
        required: false
        default: 'macos-15'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: 未签名 IPA（可用 AltStore / Sideloadly / TrollStore 自行签名安装）
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新稳定版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（真机 Release，不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project LucidaRebuild.xcodeproj -scheme LucidaRebuild \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 60

      - name: 打包为 IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "LucidaRebuild.app" | head -n 1)
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LucidaRebuild-unsigned.ipa Payload
          ls -la LucidaRebuild-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LucidaRebuild-unsigned-ipa
          path: LucidaRebuild-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
