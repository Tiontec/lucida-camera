name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          echo "--- 仓库内容 ---"
          ls -la

      - name: Detect project and scheme
        id: p
        run: |
          set -euo pipefail
          WS=$(find . -maxdepth 4 -name "*.xcworkspace" -not -path "*/.*" -not -path "./build/*" | head -1 || true)
          PJ=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/.*" -not -path "./build/*" | head -1 || true)
          if [ -n "$WS" ]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WS" >> "$GITHUB_OUTPUT"
            LIST=$(xcodebuild -list -json -workspace "$WS")
          elif [ -n "$PJ" ]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$PJ" >> "$GITHUB_OUTPUT"
            LIST=$(xcodebuild -list -json -project "$PJ")
          else
            echo "::error::仓库里没有找到 .xcodeproj / .xcworkspace"
            find . -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "$LIST"
          SCHEME=$(printf '%s' "$LIST" | python3 -c "import sys,json;d=json.load(sys.stdin);o=d.get('workspace') or d.get('project') or {};s=o.get('schemes') or [];print(s[0] if s else '')")
          if [ -z "$SCHEME" ]; then
            echo "::error::没有找到可用的 scheme"
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "选中的 scheme: $SCHEME"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          if [ "${{ steps.p.outputs.kind }}" = "workspace" ]; then
            FLAG="-workspace ${{ steps.p.outputs.path }}"
          else
            FLAG="-project ${{ steps.p.outputs.path }}"
          fi
          xcodebuild $FLAG \
            -scheme "${{ steps.p.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没有找到 .app 产物"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          NAME=$(basename "$APP" .app)
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "${NAME}-unsigned.ipa" Payload
          ls -lh
          echo "IPA_NAME=${NAME}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: out/*.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/Logs
          if-no-files-found: ignore
