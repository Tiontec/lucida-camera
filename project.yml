name: Lucida
options:
  bundleIdPrefix: com.lucida
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "11.1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
targets:
  Lucida:
    type: application
    platform: iOS
    sources:
      - path: Lucida/Sources
      - path: Lucida/Resources/Assets.xcassets
      - path: Lucida/Resources/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucida.camera
        PRODUCT_NAME: Lucida
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 澄影
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: Lucida/Info.plist
      properties:
        CFBundleDisplayName: 澄影
        CFBundleName: 澄影
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: false
        NSCameraUsageDescription: 澄影需要使用相机来取景、拍照和录像。
        NSMicrophoneUsageDescription: 澄影需要使用麦克风来录制视频的声音。
        NSPhotoLibraryAddUsageDescription: 澄影需要把拍好的照片、实况和视频保存到系统相册。
        NSPhotoLibraryUsageDescription: 澄影需要读取系统相册，用来导入照片和实况照片进行编辑。
        NSMotionUsageDescription: 澄影用陀螺仪来引导 360° 全景拍摄。
        NSLocationWhenInUseUsageDescription: 澄影可以把拍摄位置写进照片信息（可选）。
