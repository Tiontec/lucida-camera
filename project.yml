name: LucidaRebuild
options:
  bundleIdPrefix: com.lucida.rebuild
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
targets:
  LucidaRebuild:
    type: application
    platform: iOS
    sources:
      - path: Rebuild/Sources
      - path: Rebuild/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucida.rebuild.ios
        PRODUCT_NAME: LucidaRebuild
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: Rebuild/Info.plist
      properties:
        CFBundleDisplayName: 澄影重构版
        CFBundleName: 澄影重构版
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: false
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: 澄影重构版需要使用相机来取景、拍照和录像。
        NSMicrophoneUsageDescription: 澄影重构版需要使用麦克风来录制视频的声音。
        NSPhotoLibraryAddUsageDescription: 澄影重构版需要把拍好的照片、实况和视频保存到系统相册。
        NSPhotoLibraryUsageDescription: 澄影重构版需要读取系统相册，用来在相册里显示你拍的照片并和系统同步删除。
